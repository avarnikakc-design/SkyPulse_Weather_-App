<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Telemetry & Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="weather-container">
        <header>
            <h1><i class="fa-solid fa-cloud-sun"></i> SkyPulse Weather</h1>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Search global city..." autocomplete="off">
                <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </header>

        <!-- Error Message -->
        <div id="error-msg" class="hidden">
            <i class="fa-solid fa-triangle-exclamation"></i> City not found. Please check spelling.
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Fetching telemetry data...</p>
        </div>

        <!-- Weather Main Dashboard -->
        <main id="weather-dashboard" class="hidden">
            <div class="current-weather">
                <div class="location-info">
                    <h2 id="city-name">City, Country</h2>
                    <p id="current-date">Date</p>
                </div>
                <div class="temp-display">
                    <img id="weather-icon" src="" alt="Icon">
                    <div>
                        <span id="temperature">0°C</span>
                        <p id="weather-condition">Condition</p>
                    </div>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <small>Humidity</small>
                        <span id="humidity">0%</span>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <small>Wind Speed</small>
                        <span id="wind-speed">0 m/s</span>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-gauge"></i>
                    <div>
                        <small>Pressure</small>
                        <span id="pressure">0 hPa</span>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <section class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-grid"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
